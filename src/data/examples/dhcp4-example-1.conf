#
# Example 1 for kea-dhcp4
#

title = 'Example 1 Config'
conf_dir = 'Example-1'
server_types = ['primary', 'standby', 'backup']
ctrl_agent_port = '8762'

#
# Note that kea requires '/var/run/kea' and will not start
# with /run/kea which follows FHS 3. Until kea 'modernizes'
# We must use the legacy path.
# For legacy compatibility, /var/run is typically a symlink to /run.
# If not specified default is /var/run/kea. 
#
socket_dir = '/var/run/kea'


[global_options]
    # subnet may override
    domain-name-servers = ["10.1.0.10", "10.1.0.11", "10.1.0.12"]
    domain-name         = "sub1.example.com"
    domain-search       = ["sub1.example.com", "foo.com"]
    ntp-servers         = ["10.1.0.10", "10.1.0.14"]


    min-valid-lifetime  = 14400
    valid-lifetime      = 28800
    max-valid-lifetime  = 57600

#
# servers
# Sections must be named server.primary, server.secondary, server.backup
#
[server.primary]
    interface           = "eno1"
    hostname            = 'server1.sub1.example.com'   
    port                = '8761'
    auth_user           = 'kea-ctrl'
    auth_password       = 'xxxSecretHotSauce'

[server.standby]
    hostname            = 'server2.sub1.example.com'
    port                = '8761'
    interface           = "enp3s0"
    auth_user           = 'kea-ctrl'
    auth_password       = 'xxxSecretHotSauce'

[server.backup]
    hostname            = 'server3.sub1.example.com'
    port                = '8761'
    interface           = "eno1"
    auth_user           = 'kea-ctrl'
    auth_password       = 'xxxSecretHotSauce'

#
# Subnet names (xxx) must be unique net.xxx
# We only do single subnet case
#
[net]
    dns_net         = 'sub1.example.com'                    # used to get IP from hostname reservations
    # pools         = ["10.1.0.193 - 10.1.0.250", "10.1.0.19 - 10.1.0.30" ]     # can be a list of ranges
    pools           = ["10.1.0.193 - 10.1.0.250"]
    subnet          = "10.1.0.0/24"

    #valid-lifetime  = 28800
    #min_valid-lifetime  = 14400
    #max_valid-lifetime  = 57600

    [net.option-data]
    broadcast-address   = "10.1.0.255"
    routers             = "10.1.0.1"                 # default route / gateway
    #routers            = ["10.1.0.1", "10.1.0.10"]  # list of routes / gateways
    ntp-servers         = ["10.1.0.10", "10.1.0.14"]

    #
    # Reservations from this pool
    #
    # Add as many as you need
    # host is ap0
    [net.reserved.ap0]
        hw-address  = "cc:aa:aa:aa:aa:01"

    #
    # .. more reservations
    # host is bob_laptop
    [net.reserved.bob_laptop]
        hw-address  = "cc:aa:aa:aa:aa:02"

    [net.reserved.web_serv1]
        hw-address  = "cc:aa:aa:aa:aa:03"
    
